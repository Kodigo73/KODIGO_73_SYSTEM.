<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL RAP NO SE TOCA | K73</title>
    <style>
        :root { --verde: #00ff41; --rojo: #ff0000; --fuente: 'Courier New', monospace; }
        * { box-sizing: border-box; }
        body {
            background: #000 url('lucid-origin_textura_valla_metalica_de_mma_roja_y_negra_para_un_fondo-1.jpg') fixed center/cover;
            color: white; font-family: var(--fuente); margin: 0; overflow-x: hidden;
            display: flex; flex-direction: column; align-items: center; min-height: 100vh;
        }

        /* LÍNEA VERDE ESCÁNER */
        .scanline { width: 100%; height: 2px; background: var(--verde); position: fixed; top: 50%; opacity: 0.5; box-shadow: 0 0 15px var(--verde); z-index: 5; pointer-events: none; }

        header { text-align: center; margin-top: 40px; z-index: 10; }
        .logo-img { width: 120px; filter: drop-shadow(0 0 10px var(--rojo)); cursor: pointer; }
        h1 { color: var(--verde); font-size: clamp(2rem, 8vw, 4rem); text-shadow: 0 0 20px var(--verde); letter-spacing: 10px; margin: 20px 0; }

        /* NAVEGACIÓN SUBRAYADA */
        nav { display: flex; gap: 30px; margin-bottom: 30px; z-index: 10; }
        nav button {
            background: transparent; color: var(--verde); border: none; cursor: pointer;
            font-family: var(--fuente); font-size: 1.2rem; font-weight: bold; padding: 5px;
            transition: 0.3s; border-bottom: 2px solid transparent;
        }
        nav button:hover, nav button.active { border-bottom: 2px solid var(--verde); text-shadow: 0 0 10px var(--verde); }

        /* EL PANEL CENTRAL (INYECTAR) */
        .main-panel {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--rojo);
            width: 90%; max-width: 600px;
            padding: 30px; z-index: 10;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        .main-panel h2 { color: var(--rojo); text-align: center; font-size: 1.2rem; letter-spacing: 3px; margin-top: 0; margin-bottom: 25px; }

        input, select {
            width: 100%; padding: 15px; margin-bottom: 15px;
            background: rgba(20, 20, 20, 0.8); border: 1px solid #333;
            color: var(--verde); font-family: var(--fuente); font-size: 1rem;
        }

        .btn-confirmar {
            width: 100%; padding: 20px; background: var(--rojo);
            color: white; border: none; cursor: pointer;
            font-weight: bold; font-size: 1.1rem; letter-spacing: 2px;
            transition: 0.3s;
        }
        .btn-confirmar:hover { background: #b30000; box-shadow: 0 0 20px var(--rojo); }

        /* CONTENEDOR DE VIDEOS */
        .section { display: none; width: 100%; max-width: 1400px; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 25px; padding: 40px; z-index: 10; }
        .card { background: rgba(0,0,0,0.9); border: 1px solid #222; padding: 15px; border-bottom: 3px solid var(--rojo); }
        .card iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .card h3 { color: var(--verde); text-align: center; font-size: 0.9rem; margin-top: 10px; }
    </style>
</head>
<body>

<div class="scanline"></div>

<header>
    <img src="kodigo-73_4_800x450 (1).png" alt="K73" class="logo-img" onclick="location.reload()">
    <h1>EL RAP NO SE TOCA</h1>
    <p style="color:var(--verde); font-size: 0.8rem; margin-bottom: 30px;">[ SYSTEMA K73 // MODO DISPONIBLE ]</p>
</header>

<nav id="menu-principal">
    <button onclick="verSeccion('admin', this)" class="active">INICIO</button>
    <button onclick="verSeccion('octogono', this)">OCTÁGONO</button>
    <button onclick="verSeccion('xtreme', this)">X-TREME</button>
    <button onclick="verSeccion('street', this)">STREET</button>
    <button onclick="verSeccion('galeria', this)">GALERÍA</button>
</nav>

<div id="admin" class="main-panel" style="display: block;">
    <h2>INYECTAR NUEVA DATA</h2>
    <input type="text" id="titulo" placeholder="BRUTOS SUCIOS">
    <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=...">
    <select id="categoria">
        <option value="octogono">OCTÁGONO</option>
        <option value="xtreme">X-TREME</option>
        <option value="street">STREET</option>
        <option value="galeria">GALERÍA</option>
    </select>
    <button class="btn-confirmar" onclick="eyectar()">CONFIRMAR INYECCIÓN</button>
</div>

<div id="octogono" class="section"></div>
<div id="xtreme" class="section"></div>
<div id="street" class="section"></div>
<div id="galeria" class="section"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
    // --- CONEXIÓN ---
    const _url = 'https://curious-gingersnap-fcbe02.supabase.co';
    const _key = 'sb_publishable_Gsm9HFUlJnywkBeoWKjSqA_A_Wdkn5m';
    const _supabase = supabase.createClient(_url, _key);

    // --- FUNCION EYECTAR (GUARDAR) ---
    async function eyectar() {
        const title = document.getElementById('titulo').value;
        const url = document.getElementById('url').value;
        const category = document.getElementById('categoria').value;

        if (!title || !url) {
            alert("SISTEMA: ERROR - CAMPOS VACÍOS");
            return;
        }

        const { error } = await _supabase
            .from('items')
            .insert([{ title: title, url: url, category: category }]);

        if (error) {
            console.error(error);
            alert("SISTEMA: ERROR DE INYECCIÓN");
        } else {
            alert("INYECCIÓN COMPLETADA CON ÉXITO");
            location.reload();
        }
    }

    // --- CARGAR CONTENIDO ---
    async function cargar() {
        const { data, error } = await _supabase.from('items').select('*').order('created_at', { ascending: false });
        if (error) return;

        data.forEach(item => {
            const container = document.getElementById(item.category);
            if (container) {
                const card = document.createElement('div');
                card.className = 'card';
                let vidId = "";
                if(item.url.includes('v=')) vidId = item.url.split('v=')[1].split('&')[0];
                else vidId = item.url.split('/').pop();
                
                card.innerHTML = `
                    <iframe src="https://www.youtube.com/embed/${vidId}" allowfullscreen></iframe>
                    <h3>${item.title}</h3>
                `;
                container.appendChild(card);
            }
        });
    }
    cargar();

    // --- NAVEGACIÓN ---
    function verSeccion(id, btn) {
        document.querySelectorAll('.section, .main-panel').forEach(s => s.style.display = 'none');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        const target = document.getElementById(id);
        if(id === 'admin') target.style.display = 'block';
        else target.style.display = 'grid';
        
        btn.classList.add('active');
    }
</script>
</body>
</html>
