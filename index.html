<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KODIGO_73 | SYSTEM V2</title>
    <style>
        :root {
            --negro: #0a0a0a;
            --rojo: #8b0000;
            --verde: #00ff41;
            --gris: #222;
        }

        body {
            background: var(--negro) url('lucid-origin_textura_valla_metalica_de_mma_roja_y_negra_para_un_fondo-1.jpg') fixed center/cover;
            color: white;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--rojo);
            padding: 20px;
            box-shadow: 0 0 25px var(--rojo);
        }

        header { text-align: center; border-bottom: 2px solid var(--verde); padding-bottom: 15px; }

        nav { display: flex; justify-content: center; gap: 10px; margin: 20px 0; flex-wrap: wrap; }
        nav button { 
            background: #000; color: var(--verde); border: 1px solid var(--verde);
            padding: 10px 15px; cursor: pointer; font-weight: bold;
        }
        nav button:hover, nav button.active { background: var(--verde); color: #000; }

        .section { display: none; animation: fadeIn 0.5s; }
        .section.active { display: block; }

        #admin-panel { background: #111; border: 1px dashed var(--rojo); padding: 15px; }
        
        input, select, button.action-btn {
            background: #000; border: 1px solid var(--verde); color: var(--verde);
            padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box;
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { border: 1px solid var(--gris); background: #050505; padding: 10px; text-align: center; }
        iframe, img { width: 100%; border: none; border-radius: 4px; }
        img { height: auto; border: 1px solid var(--verde); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="kodigo-73_4_800x450 (1).png" alt="K73" id="logo-secreto" style="width: 180px; cursor: crosshair; user-select: none;">
        <h1 style="color: var(--verde); font-size: 1.5em;">SYSTEM_DISTRIBUTION_CENTER</h1>
    </header>

    <nav id="menu-principal">
        <button onclick="showTab('tab-octagono')" class="active">OCTÁGONO</button>
        <button onclick="showTab('tab-xtreme')">X-TREME</button>
        <button onclick="showTab('tab-street')">STREET</button>
        <button onclick="showTab('tab-fotos')">GALERÍA</button>
        <button id="btn-admin-fantasma" onclick="showTab('tab-admin')" style="display:none; border-color: var(--rojo); color: var(--rojo);">[ ADMIN_ON ]</button>
    </nav>

    <div id="tab-admin" class="section">
        <div id="admin-panel">
            <h3 style="color: var(--rojo);">[ INYECTOR_MULTIMEDIA ]</h3>
            <select id="tipo-carga">
                <option value="video">VÍDEO (YouTube)</option>
                <option value="imagen">IMAGEN (URL Directa)</option>
            </select>
            <input type="text" id="v-titulo" placeholder="TÍTULO...">
            <input type="text" id="v-url" placeholder="URL (Link YouTube o Imagen)...">
            <select id="v-cat">
                <option value="OCTÁGONO">OCTÁGONO</option>
                <option value="X-TREME">X-TREME</option>
                <option value="STREET">STREET</option>
                <option value="GALERIA">GALERÍA FOTOS</option>
            </select>
            <button id="btn-inyectar" class="action-btn">EJECUTAR INYECCIÓN</button>
        </div>
    </div>

    <div id="tab-octagono" class="section active">
        <h2 style="color: var(--verde);">// SECTOR_OCTÁGONO</h2>
        <div id="grid-octagono" class="grid"></div>
    </div>

    <div id="tab-xtreme" class="section">
        <h2 style="color: var(--verde);">// SECTOR_X-TREME</h2>
        <div id="grid-xtreme" class="grid"></div>
    </div>

    <div id="tab-street" class="section">
        <h2 style="color: var(--verde);">// SECTOR_STREET</h2>
        <div id="grid-street" class="grid"></div>
    </div>

    <div id="tab-fotos" class="section">
        <h2 style="color: var(--verde);">// ARCHIVO_VISUAL</h2>
        <div id="grid-fotos" class="grid"></div>
    </div>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        // Buscamos el botón que tiene el onclick del tabId para ponerlo active
        const buttons = document.querySelectorAll('nav button');
        buttons.forEach(btn => {
            if(btn.getAttribute('onclick')?.includes(tabId)) btn.classList.add('active');
        });
    }
</script>
<script type="module" src="app.js"></script>
</body>
</html>
