<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL RAP NO SE TOCA | KODIGO 73</title>
    <style>
        :root {
            --negro: #050505;
            --rojo: #ff0000;
            --verde: #00ff41;
            --verde-glow: rgba(0, 255, 65, 0.4);
            --fuente: 'Courier New', Courier, monospace;
        }

        body {
            background: var(--negro) url('lucid-origin_textura_valla_metalica_de_mma_roja_y_negra_para_un_fondo-1.jpg') fixed center/cover;
            color: white;
            font-family: var(--fuente);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* LÍNEA DE ESCANEO */
        .scanline {
            width: 100%;
            height: 3px;
            background: var(--verde);
            position: fixed;
            opacity: 0.4;
            box-shadow: 0 0 15px var(--verde);
            animation: scan 4s linear infinite;
            z-index: 9999;
            pointer-events: none;
        }
        @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }

        /* CONTENEDOR XL (Abarca casi toda la página) */
        .container {
            width: 96%;
            max-width: 1800px;
            margin: 10px auto;
            background: rgba(0, 0, 0, 0.92);
            border: 2px solid var(--verde);
            box-shadow: 0 0 40px rgba(0, 0, 0, 1), inset 0 0 20px var(--verde-glow);
            padding: 25px;
            box-sizing: border-box;
            min-height: 95vh;
        }

        /* LOGO MÁS GRANDE */
        .header-box { text-align: center; margin-bottom: 30px; }
        .logo-img {
            width: 350px; /* Tamaño aumentado */
            filter: drop-shadow(0 0 15px var(--rojo));
            cursor: pointer;
            transition: 0.3s;
        }
        .logo-img:hover { transform: scale(1.05); }

        h1 {
            color: var(--verde);
            font-size: 4rem; /* Título más imponente */
            text-shadow: 3px 3px var(--rojo);
            letter-spacing: 8px;
            margin: 10px 0;
            text-transform: uppercase;
        }

        /* NAVEGACIÓN */
        nav { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 25px 0; }
        nav button {
            background: #000;
            color: var(--verde);
            border: 2px solid var(--verde);
            padding: 15px 35px;
            cursor: pointer;
            font-family: var(--fuente);
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.2s;
        }
        nav button:hover, nav button.active {
            background: var(--verde);
            color: black;
            box-shadow: 0 0 25px var(--verde);
        }

        /* SECCIONES FUNCIONALES */
        .section { display: none; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; padding: 20px; }
        .section.active { display: grid; }

        .card { background: #111; border: 1px solid #333; border-top: 3px solid var(--rojo); padding: 15px; }
        .card iframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--verde); }

        /* PANEL ADMIN */
        #admin-panel { display: none; background: #0a0a0a; border: 2px dashed var(--rojo); padding: 30px; margin-top: 40px; }
        input, select { background: #000; border: 1px solid var(--verde); color: var(--verde); padding: 15px; width: 100%; margin-bottom: 10px; box-sizing: border-box; font-family: var(--fuente); }
        .btn-add { background: var(--rojo); color: white; border: none; padding: 20px 50px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1.2rem; }

        /* SHAKE EFFECT */
        .shake { animation: shakeAnim 0.3s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shakeAnim { 10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); } 30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); } }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container" id="main-container">
    <div class="header-box">
        <img src="kodigo-73_4_800x450 (1).png" alt="K73" class="logo-img" id="secret-trigger">
        <h1>EL RAP NO SE TOCA</h1>
        <div style="color: var(--verde); font-size: 0.9rem;">[ DISTRIBUCIÓN DE INTELIGENCIA TÁCTICA // VISITAS: 1,422 ]</div>
    </div>

    <nav>
        <button onclick="changeSection('octogono', this)" class="active">OCTÁGONO</button>
        <button onclick="changeSection('xtreme', this)">X-TREME</button>
        <button onclick="changeSection('street', this)">STREET</button>
        <button onclick="changeSection('galeria', this)">GALERÍA</button>
    </nav>

    <div id="octogono" class="section active"></div>
    <div id="xtreme" class="section"></div>
    <div id="street" class="section"></div>
    <div id="galeria" class="section"></div>

    <div id="admin-panel">
        <h2 style="color: var(--rojo); text-align: center;">MODO ADMINISTRADOR: INYECTAR DATA</h2>
        <input type="text" id="content-title" placeholder="TÍTULO DEL VÍDEO">
        <input type="text" id="content-url" placeholder="URL DE YOUTUBE">
        <select id="content-category">
            <option value="octogono">OCTÁGONO</option>
            <option value="xtreme">X-TREME</option>
            <option value="street">STREET</option>
            <option value="galeria">GALERÍA</option>
        </select>
        <button class="btn-add" id="save-btn">CONFIRMAR INYECCIÓN</button>
    </div>
</div>

<audio id="snd-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>
<script>
    const snd = document.getElementById('snd-click');
    const container = document.getElementById('main-container');

    function changeSection(id, btn) {
        // Sonido
        snd.currentTime = 0;
        snd.play().catch(e => console.log("Audio espera interacción"));

        // Temblor
        container.classList.remove('shake');
        void container.offsetWidth;
        container.classList.add('shake');

        // Navegación
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
