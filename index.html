<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL RAP NO SE TOCA | KODIGO 73</title>
    <style>
        :root {
            --verde: #00ff41;
            --rojo: #ff0000;
            --fuente: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; }

        body {
            background: #000 url('lucid-origin_textura_valla_metalica_de_mma_roja_y_negra_para_un_fondo-1.jpg') fixed center/cover;
            color: white;
            font-family: var(--fuente);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* LÍNEA LÁSER DINÁMICA */
        .scanline {
            width: 100%; height: 2px;
            background: var(--verde);
            position: fixed;
            opacity: 0.5;
            box-shadow: 0 0 15px var(--verde);
            animation: scan 4s linear infinite;
            z-index: 9999;
            pointer-events: none;
        }
        @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }

        /* CONTENEDOR TOTALMENTE TRANSPARENTE */
        .container {
            width: 100%;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.4); /* Casi invisible para que luzca la valla */
            backdrop-filter: blur(2px);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header { width: 100%; text-align: center; margin-bottom: 20px; }

        /* LOGO GIGANTE E IMPONENTE */
        .logo-img {
            width: 500px;
            max-width: 90%;
            filter: drop-shadow(0 0 15px var(--rojo));
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .logo-img:active { transform: scale(0.95); }

        h1 {
            color: var(--verde);
            font-size: clamp(2.5rem, 10vw, 6rem);
            text-shadow: 5px 5px 0px #000, 0 0 20px var(--verde);
            letter-spacing: 15px;
            margin: 10px 0;
            text-transform: uppercase;
        }

        /* NAVEGACIÓN ESTILO TERMINAL */
        nav { 
            display: flex; 
            justify-content: center; 
            gap: 10px; 
            flex-wrap: wrap; 
            width: 100%;
            margin-bottom: 40px;
        }

        nav button {
            background: transparent;
            color: var(--verde);
            border: none;
            border-bottom: 2px solid transparent;
            padding: 15px 25px;
            cursor: pointer;
            font-family: var(--fuente);
            font-size: 1.5rem;
            font-weight: bold;
            transition: 0.3s;
        }

        nav button:hover, nav button.active {
            color: white;
            border-bottom: 3px solid var(--verde);
            text-shadow: 0 0 10px var(--verde);
        }

        /* GRID DE CONTENIDO SIN MARCOS */
        .section {
            display: none;
            width: 100%;
            max-width: 1600px;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 40px;
            padding: 20px;
        }

        .card {
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-left: 4px solid var(--rojo);
            transition: 0.3s;
        }
        .card:hover { background: rgba(0,0,0,0.9); transform: scale(1.02); }
        .card iframe { width: 100%; aspect-ratio: 16/9; border: none; }
        .card h3 { color: var(--verde); text-align: center; font-size: 1.1rem; margin-top: 15px; }

        /* EFECTO VIBRACIÓN */
        .shake { animation: shake 0.2s ease-in-out; }
        @keyframes shake { 0% {transform: translate(0);} 25% {transform: translate(-5px, 5px);} 75% {transform: translate(5px, -5px);} }

        /* PANEL ADMIN */
        #admin-panel {
            display: none;
            width: 100%;
            max-width: 800px;
            background: #000;
            border: 2px solid var(--rojo);
            padding: 30px;
            margin-top: 50px;
        }
        input, select, .btn-inyeccion {
            width: 100%; padding: 15px; margin: 10px 0;
            background: #111; border: 1px solid var(--verde); color: var(--verde);
            font-family: var(--fuente); font-size: 1.2rem;
        }
        .btn-inyeccion { background: var(--rojo); color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container" id="main-frame">
    <header>
        <img src="kodigo-73_4_800x450 (1).png" alt="K73" class="logo-img" id="secret-trigger">
        <h1>EL RAP NO SE TOCA</h1>
        <p style="color: var(--verde); font-weight: bold;">[ SYSTEMA K73 // MODO DISPONIBLE ]</p>
    </header>

    <nav>
        <button onclick="controlNav('octogono', this)" class="active">OCTÁGONO</button>
        <button onclick="controlNav('xtreme', this)">X-TREME</button>
        <button onclick="controlNav('street', this)">STREET</button>
        <button onclick="controlNav('galeria', this)">GALERÍA</button>
    </nav>

    <div id="octogono" class="section" style="display: grid;"></div>
    <div id="xtreme" class="section"></div>
    <div id="street" class="section"></div>
    <div id="galeria" class="section"></div>

    <div id="admin-panel">
        <h2 style="color: var(--rojo); text-align: center;">INYECTAR NUEVA DATA</h2>
        <input type="text" id="content-title" placeholder="NOMBRE DEL ARCHIVO">
        <input type="text" id="content-url" placeholder="URL (YOUTUBE / IMG)">
        <select id="content-category">
            <option value="octogono">OCTÁGONO</option>
            <option value="xtreme">X-TREME</option>
            <option value="street">STREET</option>
            <option value="galeria">GALERÍA</option>
        </select>
        <button class="btn-inyeccion" id="save-btn">CONFIRMAR INYECCIÓN</button>
    </div>
</div>

<audio id="snd-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>

<script>
    const snd = document.getElementById('snd-click');
    const frame = document.getElementById('main-frame');

    function controlNav(id, btn) {
        if(snd) { snd.currentTime = 0; snd.play().catch(()=>{}); }
        frame.classList.remove('shake');
        void frame.offsetWidth;
        frame.classList.add('shake');

        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

        const target = document.getElementById(id);
        if(target) target.style.display = 'grid';
        btn.classList.add('active');
    }

    let secretClicks = 0;
    document.getElementById('secret-trigger').addEventListener('click', () => {
        secretClicks++;
        if (secretClicks === 3) {
            const pass = prompt("ACCESO RESTRINGIDO. PASSWORD:");
            if (pass === 'K73_SYSTEM') {
                document.getElementById('admin-panel').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            }
            secretClicks = 0;
        }
    });
</script>
</body>
</html>
