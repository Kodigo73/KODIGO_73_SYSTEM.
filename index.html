<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL RAP NO SE TOCA | KODIGO 73</title>
    <style>
        :root {
            --negro-trans: rgba(0, 0, 0, 0.7); /* Transparencia para ver el fondo rojo */
            --rojo: #ff0000;
            --verde: #00ff41;
            --verde-glow: rgba(0, 255, 65, 0.3);
            --fuente: 'Courier New', Courier, monospace;
        }

        body {
            background: #000 url('lucid-origin_textura_valla_metalica_de_mma_roja_y_negra_para_un_fondo-1.jpg') fixed center/cover;
            color: white;
            font-family: var(--fuente);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* LÍNEA DE ESCANEO LÁSER */
        .scanline {
            width: 100%; height: 3px;
            background: var(--verde);
            position: fixed;
            opacity: 0.3;
            box-shadow: 0 0 15px var(--verde);
            animation: scan 5s linear infinite;
            z-index: 9999;
            pointer-events: none;
        }
        @keyframes scan { 0% { top: -5%; } 100% { top: 105%; } }

        /* CONTENEDOR TRANSPARENTE (ESTILO CRISTAL) */
        .container {
            width: 98%;
            max-width: 1900px;
            margin: 10px auto;
            /* Aquí está el truco: fondo semitransparente y desenfoque */
            background: var(--negro-trans);
            backdrop-filter: blur(5px); 
            -webkit-backdrop-filter: blur(5px);
            
            border: 2px solid var(--verde);
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            padding: 40px;
            box-sizing: border-box;
            min-height: 98vh;
            position: relative;
            z-index: 10;
        }

        header { text-align: center; margin-bottom: 40px; }
        
        /* LOGO MASIVO */
        .logo-img {
            width: 450px;
            filter: drop-shadow(0 0 20px var(--rojo));
            cursor: pointer;
            transition: 0.4s;
        }

        h1 {
            color: var(--verde);
            font-size: 5rem;
            text-shadow: 4px 4px var(--rojo);
            letter-spacing: 12px;
            margin: 15px 0;
            text-transform: uppercase;
        }

        /* BOTONES TRANSPARENTES */
        nav { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 30px 0; }
        nav button {
            background: rgba(0, 255, 65, 0.1); /* Verde muy suave */
            color: var(--verde);
            border: 2px solid var(--verde);
            padding: 20px 45px;
            cursor: pointer;
            font-family: var(--fuente);
            font-size: 1.4rem;
            font-weight: bold;
            text-transform: uppercase;
            transition: 0.3s;
            backdrop-filter: blur(10px);
        }
        nav button:hover, nav button.active {
            background: var(--verde);
            color: black;
            box-shadow: 0 0 30px var(--verde);
        }

        /* SECCIONES FLOTANTES */
        .section { display: none; grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); gap: 35px; }
        .section.active { display: grid; }

        .card { 
            background: rgba(0,0,0,0.6); 
            border: 1px solid rgba(0, 255, 65, 0.3); 
            border-top: 4px solid var(--rojo); 
            padding: 20px;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--verde); transform: translateY(-5px); }
        .card iframe { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--verde); }

        /* EFECTO SHAKE */
        .shake { animation: shake 0.3s ease-in-out; }
        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-10px);} 75% {transform: translateX(10px);} }

        /* PANEL ADMIN */
        #admin-panel { display: none; margin-top: 50px; border: 2px dashed var(--rojo); padding: 30px; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>

<div class="scanline"></div>

<div class="container" id="main-frame">
    <header>
        <img src="kodigo-73_4_800x450 (1).png" alt="K73_LOGO" class="logo-img" id="secret-trigger">
        <h1>EL RAP NO SE TOCA</h1>
        <p style="color: var(--verde); letter-spacing: 5px; text-shadow: 2px 2px #000;">[ INTERFAZ TÁCTICA // FONDO INTEGRADO ]</p>
    </header>

    <nav>
        <button onclick="controlNav('octogono', this)" class="active">OCTÁGONO</button>
        <button onclick="controlNav('xtreme', this)">X-TREME</button>
        <button onclick="controlNav('street', this)">STREET</button>
        <button onclick="controlNav('galeria', this)">GALERÍA</button>
    </nav>

    <div id="octogono" class="section active"></div>
    <div id="xtreme" class="section"></div>
    <div id="street" class="section"></div>
    <div id="galeria" class="section"></div>

    <div id="admin-panel">
        <h2 style="color: var(--rojo); text-align: center;">INYECTAR DATA</h2>
        <input type="text" id="content-title" style="width:100%; padding:15px; margin-bottom:10px; background:rgba(0,0,0,0.7); border:1px solid var(--verde); color:var(--verde);" placeholder="TÍTULO">
        <input type="text" id="content-url" style="width:100%; padding:15px; margin-bottom:10px; background:rgba(0,0,0,0.7); border:1px solid var(--verde); color:var(--verde);" placeholder="URL">
        <select id="content-category" style="width:100%; padding:15px; margin-bottom:10px; background:rgba(0,0,0,0.7); border:1px solid var(--verde); color:var(--verde);">
            <option value="octogono">OCTÁGONO</option>
            <option value="xtreme">X-TREME</option>
            <option value="street">STREET</option>
            <option value="galeria">GALERÍA</option>
        </select>
        <button id="save-btn" style="width:100%; padding:20px; background:var(--rojo); color:white; border:none; font-weight:bold; cursor:pointer;">EJECUTAR</button>
    </div>
</div>

<audio id="snd-click" src="https://www.soundjay.com/buttons/sounds/button-16.mp3"></audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="app.js"></script>
<script>
 <script>
    const snd = document.getElementById('snd-click');
    const mainFrame = document.getElementById('main-frame');

    function controlNav(secId, btn) {
        // 1. Sonido y Temblor
        if(snd) {
            snd.currentTime = 0;
            snd.play().catch(()=>{}); 
        }
        
        mainFrame.classList.remove('shake');
        void mainFrame.offsetWidth; // Truco para reiniciar animación
        mainFrame.classList.add('shake');

        // 2. Ocultar TODAS las secciones primero
        const todasLasSecciones = document.querySelectorAll('.section');
        todasLasSecciones.forEach(s => {
            s.style.display = 'none'; // Forzamos el cierre
            s.classList.remove('active');
        });

        // 3. Quitar luz a todos los botones
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        // 4. Mostrar SOLO la que hemos clicado
        const seccionActiva = document.getElementById(secId);
        if (seccionActiva) {
            seccionActiva.style.display = 'grid'; // Forzamos la apertura en modo rejilla
            seccionActiva.classList.add('active');
        }

        // 5. Encender el botón clicado
        btn.classList.add('active');
    }

    // Al cargar la página, nos aseguramos de que la primera esté abierta
    window.onload = () => {
        const btnOctogono = document.querySelector('nav button');
        if(btnOctogono) controlNav('octogono', btnOctogono);
    };
</script>
</script>
</body>
</html>
